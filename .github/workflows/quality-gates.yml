name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=scripts.sync_readme_coverage --cov-report=xml --cov-report=term

      - name: Verify README coverage is synced and threshold is met
        run: |
          python scripts/sync_readme_coverage.py --coverage-file coverage.xml --readme README.md --min-coverage 90 --check-only
